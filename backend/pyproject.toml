[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    "uploads",
    "outputs",
    "__pycache__",
    ".venv",
    "venv",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]

ignore = [
    "E501", # line too long
    "B008", # FastAPI File(...), Query(...), Body(...)
    "B904", # raise ... from err
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"